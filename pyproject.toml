[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geass"
version = "0.1.0"
description = "Voice/text driven PC control agent (OpenAI + pyautogui) with a phone PWA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "mss>=9.0",
    "Pillow>=10.0",
    "pyautogui>=0.9.54",
    "openai>=1.40",
    "pydantic>=2.7",
    "tomli>=2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
geass = "geass.main:main"

[tool.setuptools.packages.find]
include = ["geass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

