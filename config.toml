[server]
host = "0.0.0.0"
port = 8765
# 留空则首次运行自动生成随机 token 并持久化到 ~/.geass/env.toml
# 也可用命令固定：python -m geass.config set --token 你的token
token = ""

[screen]
fps = 15
jpeg_quality = 70
max_width = 1920

[security]
# 安全边界：open_terminal 执行的高危 shell 命令需手机端人工审核
enabled = true
# 审核请求等待手机端回应的超时秒数，超时自动拒绝（最低 5 秒）
approval_timeout = 30
# 自定义黑名单正则（留空使用内置默认；填写后整体替换默认规则）
patterns = []

[agent]
model = "gpt-5.6-terra"
# OpenAI 兼容端点地址（留空表示 OpenAI 官方）；DeepSeek 填 https://api.deepseek.com
# 个人配置建议写入 ~/.geass/env.toml：python -m geass.config set sk-xxx URL MODEL
base_url = ""
# 模型是否支持图像输入（视觉）。不支持视觉的模型会自动降级为文本模式
vision = true
# 支持图像输入的模型白名单（逗号分隔）。填写后以白名单为准：
# 当前模型在白名单内 → 直接发截图；不在 → 自动与 PaddleOCR 配对（文本+坐标）
vision_whitelist = []
# 非视觉模型是否启用 PaddleOCR 把屏幕转成文本+坐标（AI Studio 远程 API）
ocr = true
# PaddleOCR 模型与远程服务端点
ocr_model = "PaddleOCR-VL-1.6"
ocr_base_url = "https://paddleocr.aistudio-app.com"
# AI Studio 访问 Token：请写入个人配置，不要提交到仓库
#   python -m geass.config set --ocr-token YOUR_TOKEN
ocr_token = ""
# 单个识别任务最长等待秒数（提交 + 轮询）
ocr_timeout = 90
max_steps = 30
image_max_edge = 1568
# open_terminal 一键执行命令时等待输出的超时（秒）
terminal_timeout = 15
# SKILL 目录：相对本项目根目录；每个子目录放一份 SKILL.md
# 只作为种子目录：启动时同步到运行时 skill_root/.system，运行时从 skill_root 加载
skills_dir = "skills"
# 运行时 SKILL 根目录：留空使用 ~/.geass/.skill
# 系统技能在 .system/，自动进化生成的技能放在根目录下
skill_root = ""
# 持久记忆：Agent 跨任务保存用户偏好/环境事实（remember/recall/forget 工具）
memory_enabled = true
# 记忆目录路径；留空使用 ~/.geass/.memory（条目保存在 entries.json）
memory_path = ""
# 记忆最多保留条目数与每次注入系统提示的条目数
memory_max_entries = 200
memory_context_entries = 8
# 空闲进化：无任务且空闲超过 idle 秒后，结合记忆自动编写新 SKILL
evolution_enabled = true
evolution_idle_seconds = 300
evolution_interval = 1800
evolution_max_skills = 20

[voice]
# DeepSeek 等无语音转写接口的端点可留空以禁用兜底转写（端侧识别仍可用）
fallback_model = "whisper-1"
